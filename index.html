    <!-- CSS: external file for GitHub Pages, with inline fallback for local dev servers
     that serve .css as text/plain (which browsers reject). The sync XHR runs only
     if the <link> stylesheet has 0 rules after loading. -->
    <link rel="stylesheet" href="css/tokens.css?v=1790682000000" />
    <link rel="stylesheet" href="css/styles.css?v=1790832500000" id="mainCSS" />
    <link rel="stylesheet" href="css/sales-tracker.css?v=1792628100449" />
    <script>
      (function () {
        // Give the <link> a moment, then check. If it failed (0 rules), inject via XHR.
        var link = document.getElementById('mainCSS');
        function check() {
          try {
            if (
              link.sheet &&
              link.sheet.cssRules &&
              link.sheet.cssRules.length > 0
            )
              return; // CSS loaded fine
          } catch (e) {
            /* cross-origin or not ready */
          }
          // Fallback: fetch CSS as text and inject as <style>
          var x = new XMLHttpRequest();
          x.open('GET', 'css/styles.css', false);
          x.send();
          if (x.status === 200) {
            var s = document.createElement('style');
            s.textContent = x.responseText;
            document.head.appendChild(s);
          }
        }
        // Check after link fires load event (or immediately if already loaded)
        if (link.sheet) {
          check();
        } else {
          link.onload = check;
          link.onerror = check;
        }
      })();
    </script>

      #page-planscripts .psx-body {

        padding: 28px 32px 24px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      #page-planscripts .psx-p {
        margin: 0;
        font-size: 18px;
        line-height: 1.65;
        color: #111318;
      }
      #page-planscripts .psx-tag {
        align-self: flex-start;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 700;
        line-height: 1.4;

      #page-planscripts .psx-tag-stop {
        background: var(--cha-danger-bg);
        color: #a11d1d;
      }

        background: var(--cha-warning-bg);
        color: #7a4d00;
      }
      #page-planscripts .psx-tag-ok {
        background: var(--cha-success-bg);
        color: #1a6a3c;
      }
      #page-planscripts .psx-pause {
        display: inline-flex;
        gap: 3px;
      }
      #page-planscripts .psx-pause i {
        display: block;
        width: 3px;
        height: 11px;
        border-radius: 2px;
        background: currentColor;
      }
      #page-planscripts .psx-foot {
        position: sticky;
        bottom: 0;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
        padding: 14px 24px;
        border-top: 1px solid #eceef4;
        background: var(--cha-bg-card);

      #page-planscripts .psx-count {
        font-size: 14px;
        font-weight: 600;
        color: #4a4f63;
      }

          var header = el('button', 'ds-card-header');
          header.setAttribute('type', 'button');
          header.setAttribute('aria-expanded', 'false');
          var titleWrap = el('div', 'ds-card-titlewrap');
          if (opts.number != null) {
            var numBadge = el('span', 'ds-card-num', String(opts.number));
            titleWrap.appendChild(numBadge);
          }
          titleWrap.appendChild(el('div', 'ds-card-title', opts.title));
          if (opts.oneLiner) {
            titleWrap.appendChild(el('div', 'ds-card-oneliner', opts.oneLiner));
          }
          header.appendChild(titleWrap);
          header.appendChild(el('span', 'ds-card-toggle', '+'));
          var content = el('div', 'ds-card-body');
          content.setAttribute('hidden', '');
          (opts.sections || []).forEach(function (s) {
            var box = el('div', 'ds-box ds-box-' + s.kind);
            box.appendChild(el('div', 'ds-box-label', s.label));
            if (s.kind === 'pushback' && Array.isArray(s.body)) {
              s.body.forEach(function (qa) {
                var qaWrap = el('div', 'ds-qa');
                qaWrap.appendChild(el('div', 'ds-qa-q', 'Q: ' + qa.q));
                qaWrap.appendChild(el('div', 'ds-qa-a', 'A: ' + qa.a));
                box.appendChild(qaWrap);
              });
            } else {
              box.appendChild(el('div', 'ds-box-text', s.body));
            }
            content.appendChild(box);
          });
          header.addEventListener('click', function () {
            var open = header.getAttribute('aria-expanded') === 'true';
            header.setAttribute('aria-expanded', String(!open));
            if (open) {
              content.setAttribute('hidden', '');
              header.querySelector('.ds-card-toggle').textContent = '+';
            } else {
              content.removeAttribute('hidden');
              header.querySelector('.ds-card-toggle').textContent = '-';
            }
          });
          card.appendChild(header);
          card.appendChild(content);
          return card;
        }
        function renderAsk() {
          var p = panels.ask;
          p.innerHTML = '';
          data.whatClientsAsk.forEach(function (item) {
            var card = buildExpandableCard({
              severity: item.severity,
              title: item.title,
              oneLiner: item.oneLiner,
              searchable: expandSearchableText(
                item.title + ' ' + item.oneLiner + ' ' + item.sayThis
              ),
              sections: [
                {
                  label: 'SAY THIS TO YOUR CLIENT',
                  kind: 'sayThis',
                  body: item.sayThis
                },
                {
                  label: 'IF THEY PUSH BACK',
                  kind: 'pushback',
                  body: item.pushback
                }
              ]
            });
            p.appendChild(card);
          });
          var rfWrap = el('div', 'ds-redflags');
          rfWrap.appendChild(
            el(
              'div',
              'ds-redflags-title',
              'AGENT RED FLAGS -- CHECK BEFORE SUBMISSION'
            )
          );
          var ul = el('ul', 'ds-redflags-list');
          data.redFlagsChecklist.forEach(function (rf) {
            var li = el('li', 'ds-redflags-item');
            li.setAttribute('data-searchable', expandSearchableText(rf));
            li.textContent = rf;
            ul.appendChild(li);
          });
          rfWrap.appendChild(ul);
          p.appendChild(rfWrap);
        }
        function renderAttestations() {
          var p = panels.att;
          p.innerHTML = '';
          var intro = el(
            'div',
            'ds-att-intro',
            'Tap any number to see the DocuSign quote, plain-English meaning, what to say, and how to handle pushback.'
          );
          p.appendChild(intro);
          var grid = el('div', 'ds-att-grid');
          var details = el('div', 'ds-att-details');
          data.attestations.forEach(function (a) {
            var tile = el('button', 'ds-att-tile ds-sev-' + a.severity);
            tile.setAttribute('type', 'button');
            tile.setAttribute(
              'data-searchable',
              expandSearchableText(
                a.title +
                  ' ' +
                  a.shortLabel +
                  ' ' +
                  a.whatItMeans +
                  ' ' +
                  a.docusignText
              )
            );
            tile.appendChild(el('div', 'ds-att-num', String(a.number)));
            tile.appendChild(el('div', 'ds-att-label', a.shortLabel));
            tile.addEventListener('click', function () {
              renderAttDetail(a, details);
              details.scrollIntoView({ behavior: 'smooth', block: 'start' });
            });
            grid.appendChild(tile);
          });
          p.appendChild(grid);
          p.appendChild(details);
          var glossWrap = el('div', 'ds-glossary');
          glossWrap.appendChild(
            el(
              'div',
              'ds-glossary-title',
              'GLOSSARY -- TRANSLATE THE LEGAL STUFF'
            )
          );
          data.glossary.forEach(function (g) {
            var row = el('div', 'ds-glossary-row');
            row.setAttribute(
              'data-searchable',
              expandSearchableText(g.term + ' ' + g.def)
            );
            row.appendChild(el('div', 'ds-glossary-term', g.term));
            row.appendChild(el('div', 'ds-glossary-def', g.def));
            glossWrap.appendChild(row);
          });
          p.appendChild(glossWrap);
        }
        function renderAttDetail(a, mount) {
          mount.innerHTML = '';
          var card = el('div', 'ds-att-detail ds-sev-' + a.severity);
          card.setAttribute(
            'data-searchable',
            expandSearchableText(
              a.title +
                ' ' +
                a.docusignText +
                ' ' +
                a.whatItMeans +
                ' ' +
                a.sayToClient
            )
          );
          card.appendChild(
            el('div', 'ds-att-detail-num', '#' + a.number + ' -- ' + a.title)
          );
          var quote = el('div', 'ds-box ds-box-quote');
          quote.appendChild(
            el('div', 'ds-box-label', 'WHAT THE DOCUSIGN SAYS')
          );
          quote.appendChild(el('div', 'ds-box-text', a.docusignText));
          card.appendChild(quote);
          var means = el('div', 'ds-box ds-box-means');
          means.appendChild(el('div', 'ds-box-label', 'WHAT IT REALLY MEANS'));
          means.appendChild(el('div', 'ds-box-text', a.whatItMeans));
          card.appendChild(means);
          var say = el('div', 'ds-box ds-box-sayThis');
          say.appendChild(el('div', 'ds-box-label', 'SAY THIS TO YOUR CLIENT'));
          say.appendChild(el('div', 'ds-box-text', a.sayToClient));
          card.appendChild(say);
          var push = el('div', 'ds-box ds-box-pushback');
          push.appendChild(el('div', 'ds-box-label', 'IF THEY PUSH BACK'));
          a.pushback.forEach(function (qa) {
            var qaWrap = el('div', 'ds-qa');
            qaWrap.appendChild(el('div', 'ds-qa-q', 'Q: ' + qa.q));
            qaWrap.appendChild(el('div', 'ds-qa-a', 'A: ' + qa.a));
            push.appendChild(qaWrap);
          });
          card.appendChild(push);
          mount.appendChild(card);
        }
        function renderFull() {
          var p = panels.full;
          p.innerHTML = '';
          var wo = data.workingOwnerOverview;
          var woCard = el('div', 'ds-section');
          woCard.appendChild(el('h3', 'ds-section-title', wo.title));
          woCard.appendChild(el('p', 'ds-section-summary', wo.summary));
          var woGrid = el('div', 'ds-twocol');
          wo.cards.forEach(function (c) {
            var box = el('div', 'ds-section-card');
            box.appendChild(el('h4', 'ds-section-card-h', c.heading));
            if (c.body) box.appendChild(el('p', 'ds-section-card-p', c.body));
            if (c.bullets) {
              var ul = el('ul', 'ds-section-card-ul');
              c.bullets.forEach(function (b) {
                ul.appendChild(el('li', null, b));
              });
              box.appendChild(ul);
            }
            woGrid.appendChild(box);
          });
          woCard.appendChild(woGrid);
          woCard.setAttribute(
            'data-searchable',
            expandSearchableText(wo.title + ' ' + wo.summary)
          );
          p.appendChild(woCard);
          var pp = data.planPositioning;
          var ppCard = el('div', 'ds-section');
          ppCard.appendChild(el('h3', 'ds-section-title', pp.title));
          ppCard.appendChild(el('p', 'ds-section-summary', pp.intro));
          var ppGrid = el('div', 'ds-twocol');
          pp.cards.forEach(function (c) {
            var box = el('div', 'ds-section-card');
            box.appendChild(el('h4', 'ds-section-card-h', c.heading));
            if (c.bullets) {
              var ul = el('ul', 'ds-section-card-ul');
              c.bullets.forEach(function (b) {
                ul.appendChild(el('li', null, b));
              });
              box.appendChild(ul);
            }
            ppGrid.appendChild(box);
          });
          ppCard.appendChild(ppGrid);
          ppCard.setAttribute(
            'data-searchable',
            expandSearchableText(pp.title + ' ' + pp.intro)
          );
          p.appendChild(ppCard);
          var bp = data.bigPicture;
          var bpCard = el('div', 'ds-section');
          bpCard.appendChild(el('h3', 'ds-section-title', bp.title));
          bpCard.appendChild(el('p', 'ds-section-summary', bp.summary));
          var bpUl = el('ul', 'ds-section-card-ul');
          bp.points.forEach(function (pt) {
            bpUl.appendChild(el('li', null, pt));
          });
          bpCard.appendChild(bpUl);
          bpCard.setAttribute(
            'data-searchable',
            expandSearchableText(bp.title + ' ' + bp.summary)
          );
          p.appendChild(bpCard);
          var secsHeader = el(
            'h3',
            'ds-section-title',
            'Section-by-Section Breakdown (25)'
          );
          p.appendChild(secsHeader);
          data.sections.forEach(function (s) {
            var card = el(
              'div',
              'ds-mini-section' + (s.warning ? ' ds-warn' : '')
            );
            var searchTxt = s.title + ' ';
            var head = el('div', 'ds-mini-section-h');
            head.appendChild(
              el('span', 'ds-mini-section-num', String(s.number) + '.')
            );
            head.appendChild(el('span', 'ds-mini-section-t', s.title));
            card.appendChild(head);
            if (s.body) {
              card.appendChild(el('p', 'ds-mini-section-p', s.body));
              searchTxt += s.body + ' ';
            }
            if (s.intro) {
              card.appendChild(el('p', 'ds-mini-section-p', s.intro));
              searchTxt += s.intro + ' ';
            }
            if (s.bullets) {
              var ul = el('ul', 'ds-mini-section-ul');
              s.bullets.forEach(function (b) {
                ul.appendChild(el('li', null, b));
                searchTxt += b + ' ';
              });
              card.appendChild(ul);
            }
            if (s.outro) {
              card.appendChild(el('p', 'ds-mini-section-p', s.outro));
              searchTxt += s.outro + ' ';
            }
            card.setAttribute(
              'data-searchable',
              expandSearchableText(searchTxt)
            );
            p.appendChild(card);
          });
          var faqHeader = el('h3', 'ds-section-title', 'Top Client Questions');
          p.appendChild(faqHeader);
          data.faq.forEach(function (qa) {
            var card = el('div', 'ds-faq');
            card.appendChild(el('div', 'ds-faq-q', qa.q));
            card.appendChild(el('div', 'ds-faq-a', qa.a));
            card.setAttribute(
              'data-searchable',
              expandSearchableText(qa.q + ' ' + qa.a)
            );
            p.appendChild(card);
          });
        }
        function clearTabBadges() {
          tabs.forEach(function (tab) {
            var baseLabel = tab.getAttribute('data-base-label');
            if (baseLabel) tab.textContent = baseLabel;
          });
        }
        function exitSearchMode() {
          var results = group.querySelector('.ds-search-results');
          if (results) {
            results.innerHTML = '';
            results.setAttribute('hidden', '');
          }
          var activeTab = group.querySelector('.ds-tab.is-active');
          var key = activeTab ? activeTab.getAttribute('data-tab') : 'ask';
          if (!panels[key]) key = 'ask';
          Object.keys(panels).forEach(function (k) {
            if (k === key) {
              panels[k].removeAttribute('hidden');
              panels[k].classList.add('is-active');
            } else {
              panels[k].setAttribute('hidden', '');
              panels[k].classList.remove('is-active');
            }
          });
          tabs.forEach(function (t) {
            var tKey = t.getAttribute('data-tab');
            if (tKey === key) {
              t.classList.add('is-active');
              t.setAttribute('aria-selected', 'true');
            } else {
              t.classList.remove('is-active');
              t.setAttribute('aria-selected', 'false');
            }
          });
          if (tabsBar) tabsBar.style.display = '';
          clearTabBadges();
        }
        function enterSearchMode(query) {
          var q = (query || '').trim().toLowerCase();
          var terms = expandWithSynonyms(q);
          var results = group.querySelector('.ds-search-results');
          if (!results) return;
          if (!q) {
            exitSearchMode();
            return;
          }
          var allMatches = { ask: [], att: [], full: [] };
          Object.keys(panels).forEach(function (key) {
            var panel = panels[key];
            if (!panel) return;
            var nodes = panel.querySelectorAll('[data-searchable]');
            nodes.forEach(function (n) {
              var hay = (n.getAttribute('data-searchable') || '').toLowerCase();
              if (!hay) return;
              var hit = terms.some(function (t) {
                if (!t) return false;
                if (hay.indexOf(t) !== -1) return true;
                return fuzzyIncludes(hay, t);
              });
              if (hit) {
                allMatches[key].push(n.cloneNode(true));
              }
            });
          });
          Object.keys(panels).forEach(function (key) {
            panels[key].setAttribute('hidden', '');
            panels[key].classList.remove('is-active');
          });
          if (tabsBar) tabsBar.style.display = 'none';
          results.innerHTML = '';
          var totalCount =
            allMatches.ask.length +
            allMatches.att.length +
            allMatches.full.length;
          if (totalCount === 0) {
            var empty = document.createElement('div');
            empty.className = 'ds-search-empty';
            empty.textContent = 'No matches in any tab.';
            results.appendChild(empty);
          } else {
            var headings = {
              ask: 'WHAT CLIENTS ASK MOST',
              att: '10 ADDITIONAL MEMBER ATTESTATIONS',
              full: 'FULL WALKTHROUGH'
            };
            Object.keys(allMatches).forEach(function (key) {
              if (!allMatches[key].length) return;
              var groupBlock = document.createElement('div');
              groupBlock.className = 'ds-search-group';
              var h = document.createElement('div');
              h.className = 'ds-search-group-heading';
              h.textContent =
                headings[key] + ' (' + allMatches[key].length + ')';
              groupBlock.appendChild(h);
              allMatches[key].forEach(function (node) {
                groupBlock.appendChild(node);
              });
              results.appendChild(groupBlock);
            });
          }
          results.removeAttribute('hidden');
        }
        search.addEventListener('input', function () {
          var v = (search.value || '').trim();
          if (!v) {
            exitSearchMode();
          } else {
            enterSearchMode(v);
          }
        });
        renderAsk();
        renderAttestations();
        renderFull();
      })();
    </script>
